var state=window.hatchWidget.getState({picked:null});
function render(){
  var wrap=document.getElementById('cards');wrap.innerHTML='';
  ['A','B','C'].forEach(function(k,i){
    var b=document.createElement('button');
    b.className='card c'+(i+1)+((state.picked&&state.picked!==k)?' dim':'');
    b.type='button';b.setAttribute('aria-label','カード'+k);
    b.innerHTML='<span class="inner"><span class="face"><img class="backimg" src="'+CARD+'" alt=""></span></span>';
    b.addEventListener('click',function(){
      if(state.picked)return;
      state=Object.assign({},state,{picked:k});
      window.hatchWidget.setState(state);render();
    });
    wrap.appendChild(b);
  });
  var rv=document.getElementById('reveal');
  if(state.picked){
    var d=DRAW[state.picked];
    rv.innerHTML='<div class="bigcard"><img class="art" src="'+IMGS[state.picked]+'" alt=""><span class="frontin"><span class="cname">'+d.name+'</span><span class="cpos">'+state.picked+' ｜ '+d.pos+'</span><span class="cread">'+d.read+'</span></span></div><div class="closehint">今日の結果はこれで確定です</div>';
    rv.className='reveal show';
  }else{
    rv.innerHTML='';rv.className='reveal';
  }
}
window.addEventListener('hatch-widget-state',function(e){state=e.detail.state;render();});
render();
</script>
